name: deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "docs/**"
      - "alchemy.run.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # dashboard -> apps/dashboard/dist, docs -> apps/dashboard/dist/docs
      - run: bun run site:build
      # Alchemy state lives in the Cloudflare state store; provision it once
      # with `bun alchemy state bootstrap` before the first CI deploy.
      - run: bun alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
